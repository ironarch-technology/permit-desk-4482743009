# Local development stack: Permit Desk, its database, and stand-ins for the
# four city services it talks to.
#
#   docker compose up --build
#
# Timings are shortened here so an application moves through the pipeline in
# about a minute. Production values are the defaults in appsettings.json.

name: mountport-permit-desk

x-mock: &mock
  build: ./mocks
  restart: unless-stopped
  mem_limit: 128m
  cpus: 0.5

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: permitdesk
      POSTGRES_USER: permitdesk
      POSTGRES_PASSWORD: permitdesk-local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitdesk -d permitdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0

  migrate:
    build:
      context: .
      dockerfile: src/PermitDesk.Api/Dockerfile
    command: ["migrate", "seed"]
    environment: &api-env
      ConnectionStrings__PermitDesk: Host=db;Database=permitdesk;Username=permitdesk;Password=permitdesk-local
      Auth__SigningKey: local-development-signing-key-not-for-deployment
      Zoning__ReconcileAfterSeconds: "30"
      Review__PollSeconds: "5"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: src/PermitDesk.Api/Dockerfile
    environment: *api-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 2.0

  zoning:
    <<: *mock
    command: ["zoning.js"]
    environment:
      PORT: "7101"
      API_KEY: zn_live_5c1e8a94d2f74b07a36be0c9817d4f52
      WEBHOOK_SECRET: whsec_zn_Qm7tR2xLw9KpV4sHj8NfYc3BdA6uEg1Z
      PERMIT_DESK_WEBHOOK_URL: http://api:8080/hooks/zoning
      WEBHOOK_DROP_RATE: "0.25"
    ports:
      - "7101:7101"

  review:
    <<: *mock
    command: ["review.js"]
    environment:
      PORT: "7102"
      API_KEY: prs_live_b84f2a7d19c04e5f8d3a6c0e72b915fa

  scheduling:
    <<: *mock
    command: ["scheduling.js"]
    environment:
      PORT: "7103"
      API_KEY: insp_live_0d9c3e7b5a1f48269e4b7d2c6f8a13e0

  cashiering:
    <<: *mock
    command: ["cashiering.js"]
    environment:
      PORT: "7104"
      API_KEY: csh_live_f3a91c5e7b2d4086a1e9d4c7b05f682c
      WEBHOOK_SECRET: whsec_csh_T8vN3kXq6JmW1rBz5LgPd9YhC2sFa7Eu
      PERMIT_DESK_WEBHOOK_URL: http://api:8080/hooks/cashiering
      PUBLIC_URL: http://localhost:7104
      PORTAL_URL: http://localhost:8080
    ports:
      - "7104:7104"

volumes:
  pgdata:
